name: Publish to registry
on:
  push:
    branches:
      - 'main'

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  pre-publish:
    uses: ./.github/workflows/publish-dry-run.yml
  publish:
    needs: pre-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = full history + all tags; semantic-release needs them to find the
          # last release and compute the next version.
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # no dependency cache in the job that can mint the npm OIDC token

      - name: Install dependencies
        run: yarn --immutable

      - name: Build
        run: yarn build

      - name: Verify provenance attestations & registry signatures of installed dependencies
        run: npm audit signatures

      - name: Audit dependencies for known vulnerabilities
        run: yarn npm audit --recursive --no-deprecations

      - name: Publish
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
