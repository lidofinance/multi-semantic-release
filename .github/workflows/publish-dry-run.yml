name: Publish Dry Run
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  # no id-token: this job must not be able to obtain an npm publish token

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    environment: pre-publish
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = full history + all tags; semantic-release needs them to find the
          # last release and compute the next version.
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Build
        run: yarn build

      - name: Dry run Publish
        run: |
          # npm verifyConditions skipped: no npm auth here; the publish job verifies OIDC before releasing
          yarn semantic-release --dry-run --silent --verify-conditions @semantic-release/github > /tmp/semantic-release-output
          grep -E '#|###|\*' /tmp/semantic-release-output > dry_run_output.txt || [ $? -eq 1 ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write results to summary
        run: |
          if [ -s dry_run_output.txt ]; then
            echo "# Packages to be published:" >> $GITHUB_STEP_SUMMARY
            cat dry_run_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Nothing will be published" >> $GITHUB_STEP_SUMMARY
          fi
